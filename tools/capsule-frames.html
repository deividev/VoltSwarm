<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      /* Encuadre concept sampler. Same real bg (capsule-bg-v2) + head + wordmark
         as the capsule. Pick a frame concept with ?style=NAME. Each concept is a
         separate overlay, shown only when body has the matching class. All are
         LIGHT — they must NOT eat the swarm background. */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      #capsule {
        position: relative;
        width: 1232px;
        height: 706px;
        overflow: hidden;
        background: #0a0d12;
        font-family: sans-serif;
      }
      #bg {
        position: absolute; inset: 0; width: 100%; height: 100%;
        object-fit: cover; object-position: center 46%;
        filter: saturate(1.02) brightness(0.8) contrast(1.14);
      }
      #vignette {
        position: absolute; inset: 0;
        background:
          radial-gradient(ellipse 60% 58% at 50% 34%, rgba(6,8,12,0.82) 0%, rgba(6,8,12,0.34) 46%, rgba(6,8,12,0) 72%),
          linear-gradient(to bottom, rgba(6,8,12,0.6) 0%, rgba(6,8,12,0) 18%, rgba(6,8,12,0) 72%, rgba(6,8,12,0.66) 100%),
          linear-gradient(to right, rgba(6,8,12,0.5) 0%, rgba(6,8,12,0) 12%, rgba(6,8,12,0) 88%, rgba(6,8,12,0.5) 100%);
      }
      #haze {
        position: absolute; inset: 0;
        background: radial-gradient(ellipse 60% 34% at 50% 96%, rgba(255,90,60,0.14) 0%, rgba(150,60,200,0.08) 45%, transparent 72%);
        mix-blend-mode: screen;
      }
      /* ---------- shared logo layout ---------- */
      #logo-group {
        position: absolute; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; transform: translateY(-64px);
      }
      #head-wrap { position: relative; display: flex; justify-content: center; align-items: center; margin-bottom: -150px; z-index: 2; }
      #head-halo {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
        width: 460px; height: 460px;
        background: radial-gradient(circle at 50% 50%, rgba(99,236,253,0.55) 0%, rgba(63,169,245,0.28) 34%, rgba(63,169,245,0) 66%);
        mix-blend-mode: screen; z-index: 0;
      }
      #eyes-glow {
        position: absolute; top: 54%; left: 50%; transform: translate(-50%,-50%);
        width: 210px; height: 100px;
        background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(150,245,255,0.42) 0%, rgba(99,236,253,0.2) 48%, transparent 72%);
        mix-blend-mode: screen; z-index: 2;
      }
      #head {
        position: relative; z-index: 1; width: 344px; height: 344px; object-fit: contain;
        filter: drop-shadow(0 8px 20px rgba(0,0,0,0.6)) drop-shadow(0 0 26px rgba(99,236,253,0.5));
      }
      #wordmark-wrap { position: relative; display: flex; justify-content: center; align-items: center; z-index: 2; }
      #wordmark-glow {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
        width: 840px; height: 210px;
        background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(255,196,77,0.18) 0%, rgba(99,236,253,0.1) 48%, transparent 72%);
        mix-blend-mode: screen; z-index: 0;
      }
      #wordmark {
        width: 940px; max-width: 96%; object-fit: contain; position: relative; z-index: 1;
        filter:
          drop-shadow(0 0 3px rgba(0,0,0,1)) drop-shadow(0 3px 0 rgba(0,0,0,0.9))
          drop-shadow(3px 6px 0 rgba(0,0,0,0.75)) drop-shadow(0 14px 24px rgba(0,0,0,0.85))
          drop-shadow(0 0 30px rgba(99,236,253,0.36));
      }
      #wordmark-shade {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%) translateY(112px);
        width: 900px; height: 200px;
        background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(7,10,15,0.55) 0%, rgba(7,10,15,0.28) 52%, rgba(7,10,15,0) 78%);
        z-index: 0;
      }

      /* ================= FRAME CONCEPTS (hidden by default) ================= */
      .frame { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%) translateY(-8px); display: none; z-index: 1; }
      body.brackets .frame.brackets,
      body.outline  .frame.outline,
      body.hazard   .frame.hazard,
      body.rivet    .frame.rivet,
      body.underline .frame.underline,
      body.spotlight .frame.spotlight { display: block; }

      /* 1 — HUD corner brackets */
      .frame.brackets { width: 1004px; height: 486px; }
      .frame.brackets .corner {
        position: absolute; width: 58px; height: 58px; border: 5px solid #6fe9ff;
        filter: drop-shadow(0 0 7px rgba(99,236,253,0.75)) drop-shadow(0 2px 3px rgba(0,0,0,0.7));
      }
      .frame.brackets .tl { top:0; left:0; border-right:none; border-bottom:none; }
      .frame.brackets .tr { top:0; right:0; border-left:none; border-bottom:none; }
      .frame.brackets .bl { bottom:0; left:0; border-right:none; border-top:none; }
      .frame.brackets .br { bottom:0; right:0; border-left:none; border-top:none; }

      /* 2 — Neon notched outline (arcade marquee outline, no fill) */
      .frame.outline { width: 1064px; height: 512px; }
      .frame.outline svg { width: 100%; height: 100%; overflow: visible;
        filter: drop-shadow(0 0 8px rgba(99,236,253,0.7)) drop-shadow(0 3px 5px rgba(0,0,0,0.7)); }

      /* 3 — Hazard caution-tape border (scrapyard identity) */
      .frame.hazard {
        width: 1080px; height: 520px; border: 15px solid transparent;
        border-image: repeating-linear-gradient(45deg, #f2b705 0 16px, #14171d 16px 32px) 15;
        filter: drop-shadow(0 3px 6px rgba(0,0,0,0.7));
      }

      /* 4 — Riveted metal bezel (machine-panel window, thin) */
      .frame.rivet {
        width: 1060px; height: 508px; border: 9px solid #2c333d;
        border-radius: 4px;
        background: linear-gradient(#3a424d, #232a33) border-box;
        -webkit-mask: linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor; mask-composite: exclude;
        box-shadow: inset 0 0 0 2px rgba(99,236,253,0.35), 0 0 10px rgba(0,0,0,0.6);
      }
      .frame.rivet .bolt {
        position: absolute; width: 12px; height: 12px; border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #aeb7c2, #4a525c 70%, #20262e);
        box-shadow: 0 1px 2px rgba(0,0,0,0.8);
      }
      .frame.rivet .b1 { top:-2px; left:-2px; } .frame.rivet .b2 { top:-2px; right:-2px; }
      .frame.rivet .b3 { bottom:-2px; left:-2px; } .frame.rivet .b4 { bottom:-2px; right:-2px; }

      /* 5 — Minimal underline bar under wordmark + tiny top ticks */
      .frame.underline { width: 1004px; height: 486px; }
      .frame.underline .bar {
        position: absolute; left: 50%; bottom: 116px; transform: translateX(-50%);
        width: 720px; height: 6px;
        background: linear-gradient(to right, transparent, #6fe9ff 18%, #6fe9ff 82%, transparent);
        filter: drop-shadow(0 0 8px rgba(99,236,253,0.8));
      }
      .frame.underline .tick { position: absolute; top: 0; width: 4px; height: 40px; background: #6fe9ff;
        filter: drop-shadow(0 0 6px rgba(99,236,253,0.8)); }
      .frame.underline .tk-l { left: 0; } .frame.underline .tk-r { right: 0; }

      /* 6 — No frame, just a tighter spotlight (control) */
      .frame.spotlight { width: 1232px; height: 706px; }
      .frame.spotlight .glow {
        position: absolute; top: 42%; left: 50%; transform: translate(-50%,-50%);
        width: 820px; height: 560px;
        background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(10,16,26,0) 40%, rgba(6,9,14,0.66) 78%, rgba(6,9,14,0.85) 100%);
      }
    </style>
  </head>
  <body>
    <div id="capsule">
      <img id="bg" src="../tmp/imagegen/capsule-bg-v2.png" alt="" />
      <div id="vignette"></div>
      <div id="haze"></div>

      <div class="frame spotlight"><div class="glow"></div></div>

      <div id="logo-group">
        <div class="frame brackets">
          <div class="corner tl"></div><div class="corner tr"></div>
          <div class="corner bl"></div><div class="corner br"></div>
        </div>
        <div class="frame outline">
          <svg viewBox="0 0 1064 512" preserveAspectRatio="none">
            <polygon points="26,2 1038,2 1062,26 1062,486 1038,510 26,510 2,486 2,26"
              fill="none" stroke="#6fe9ff" stroke-width="4" />
          </svg>
        </div>
        <div class="frame hazard"></div>
        <div class="frame rivet">
          <div class="bolt b1"></div><div class="bolt b2"></div>
          <div class="bolt b3"></div><div class="bolt b4"></div>
        </div>
        <div class="frame underline">
          <div class="bar"></div><div class="tick tk-l"></div><div class="tick tk-r"></div>
        </div>

        <div id="wordmark-shade"></div>
        <div id="head-wrap">
          <div id="head-halo"></div>
          <img id="head" src="../art/steam/logo.png" alt="" />
          <div id="eyes-glow"></div>
        </div>
        <div id="wordmark-wrap">
          <div id="wordmark-glow"></div>
          <img id="wordmark" src="../art/steam/logo-letras.png" alt="" />
        </div>
      </div>
    </div>
    <script>
      const s = new URLSearchParams(location.search).get('style') || 'brackets';
      document.body.className = s;
    </script>
  </body>
</html>
