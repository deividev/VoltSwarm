name: Notify Wiki of content update

on:
  push:
    branches:
      - codex/demo-map1
      - codex/map-2

permissions:
  contents: read

jobs:
  publish-wiki:
    uses: deividev/VoltSwarm-wiki/.github/workflows/publish.yml@327ca08d62034546fe3476f0c1469e65ea7beaaa
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
